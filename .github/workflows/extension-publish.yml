# Publishes the Save to Gallery extension to the Chrome Web Store (item
# nlhmjpghlanlanpapgigmacjbnjoancb, Unlisted) whenever a merge to main changes
# extension/manifest.json. Chrome then updates every installed copy by itself.
# Auth: service account cws-publisher@laniameda-review.iam.gserviceaccount.com,
# registered in the Web Store dashboard (Settings → Service account).
# Secrets: CWS_SERVICE_ACCOUNT_JSON, CWS_PUBLISHER_ID, CWS_EXTENSION_ID.
# Run it by hand with "status only" to check the store state without uploading.
name: Publish extension

on:
  push:
    branches: [main]
    paths: [extension/manifest.json]
  workflow_dispatch:
    inputs:
      status_only:
        description: Only read the store status, upload nothing
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUB: ${{ secrets.CWS_PUBLISHER_ID }}
      ITEM: ${{ secrets.CWS_EXTENSION_ID }}
      API: https://chromewebstore.googleapis.com
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
      - name: Store status
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          curl -fsS -H "Authorization: Bearer $TOKEN" "$API/v2/publishers/$PUB/items/$ITEM:fetchStatus" | jq 'del(.publicKey)'
      - name: Package
        if: github.event_name == 'push' || inputs.status_only == false
        id: pkg
        run: echo "zip=$(scripts/package-extension.sh HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload and publish
        if: github.event_name == 'push' || inputs.status_only == false
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          ZIP: ${{ steps.pkg.outputs.zip }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $TOKEN"
          UP=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/zip" --data-binary @"$ZIP" \
            "$API/upload/v2/publishers/$PUB/items/$ITEM:upload")
          echo "upload: $UP"
          if echo "$UP" | jq -e '.error' >/dev/null; then
            echo "::error::Upload refused (a version still in review blocks a new upload; the next version bump retries)."; exit 1
          fi
          STATE=$(echo "$UP" | jq -r '.uploadState // empty')
          for i in $(seq 1 30); do
            [ "$STATE" = "SUCCEEDED" ] && break
            [ "$STATE" = "FAILED" ] && { echo "::error::Upload failed"; exit 1; }
            sleep 10
            STATE=$(curl -fsS -H "$AUTH" "$API/v2/publishers/$PUB/items/$ITEM:fetchStatus" | jq -r '.lastAsyncUploadState // "SUCCEEDED"')
          done
          PUBRES=$(curl -sS -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{}' \
            "$API/v2/publishers/$PUB/items/$ITEM:publish")
          echo "publish: $PUBRES"
          echo "$PUBRES" | jq -e '.error | not' >/dev/null
